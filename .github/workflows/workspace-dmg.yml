name: Workspace DMG

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  bundle:
    name: Build workspace bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.config.outputs.version }}
      clerk_publishable_key: ${{ steps.config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.config.outputs.relay_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - id: config
        name: Set preview version and public configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          set -a
          source .env
          set +a
          version="$(node -p "require('./apps/desktop/package.json').version")-preview.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          node scripts/update-release-package-versions.ts "$version"
          {
            echo "version=$version"
            echo "clerk_publishable_key=$T3CODE_CLERK_PUBLISHABLE_KEY"
            echo "clerk_jwt_template=$T3CODE_CLERK_JWT_TEMPLATE"
            echo "clerk_cli_oauth_client_id=$T3CODE_CLERK_CLI_OAUTH_CLIENT_ID"
            echo "relay_url=$T3CODE_RELAY_URL"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  dmg:
    name: Build unsigned Apple-silicon DMG
    needs: bundle
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: preview
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}
      label: unsigned Apple-silicon DMG
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true

  linux_cli:
    name: Build Linux x64 CLI archive
    needs: bundle
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: preview
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.bundle.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.bundle.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.bundle.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.bundle.outputs.relay_url }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  publish:
    name: Publish workspace prerelease
    needs: [bundle, dmg, linux_cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-mac-arm64
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: cli-mac-arm64
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: cli-linux-x64
          path: release

      # The v<version> tag and SHA256SUMS are what scripts/install.sh resolves,
      # so a remote machine installs this build with T3CODE_CHANNEL=preview.
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          (cd release && sha256sum t3-*.tar.gz > SHA256SUMS)
          gh release create "v${VERSION}" release/*.dmg release/t3-*.tar.gz release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "T3 Code workspace ${VERSION}" \
            --notes "Unsigned workspace test build from ${GITHUB_SHA}." \
            --prerelease
